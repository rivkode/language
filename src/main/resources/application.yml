server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: utf-8
      enabled: true

spring:
  application:
    name: language
  # Local 프로필을 기본으로 사용
  profiles:
    active: local

  # 공통 JPA 설정 (프로필별로 오버라이드 가능)
  jpa:
    open-in-view: true
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        global_quoted_identifiers: true
  ai:
    openai:
      api-key: ${OPEN_AI_API_KEY:your-api-key-here}
      chat:
        options:
          model: gpt-4o-mini-2024-07-18
          temperature: 0.7
          max-tokens: 1000
      audio:
        transcription:
          options:
            model: gpt-4o-mini-transcribe

  # 파일 업로드 설정
  servlet:
    multipart:
      enabled: true
      max-request-size: 15MB
      max-file-size: 15MB

