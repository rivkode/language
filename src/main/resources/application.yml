
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: utf-8
      enabled: true

spring:
  application:
  name: language

  datasource:
    url: jdbc:mysql://localhost:3306/language_db?useSSL=false&characterEncoding=UTF-8
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        global_quoted_identifiers: true
    show-sql: true

